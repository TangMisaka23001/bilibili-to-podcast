[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-podcast"
version = "0.1.0"
description = "Convert Bilibili collection URLs into podcast RSS feeds"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43",
    "botocore>=1.43",
    "PyYAML>=6.0",
    "yt-dlp>=2026.8.19",
    "schedule>=1.2",
]
# NOTE: bilibili-api fork 以 vendor.tar.gz 分发，需在安装本项目前单独安装：
#   tar -xzf vendor.tar.gz && pip install -e ./vendor/bilibili-api-main
# 不写进 dependencies 是因为 PEP 621 无法表达相对路径，绝对路径会锁死克隆位置。

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "moto[s3]>=5",
]

[project.scripts]
b2p-prune = "bilibili_podcast.cli.prune:main"
b2p-sync  = "bilibili_podcast.cli.sync:main"
b2p-fetch = "bilibili_podcast.cli.fetch:main"
b2p-rss   = "bilibili_podcast.cli.rss_cmd:main"
b2p-gen-index = "bilibili_podcast.cli.gen_index:main"
b2p-cron  = "bilibili_podcast.cli.cron:main"
b2p-size  = "bilibili_podcast.cli.size:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bilibili_podcast = ["py.typed"]
